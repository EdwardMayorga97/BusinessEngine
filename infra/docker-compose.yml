version: '3.9'

services:

  engine:
    build:
      context: ..
      dockerfile: infra/engine.Dockerfile
    ports:
      - "8000:8000"
    env_file: ../.env
    depends_on:
      - postgres
      - redis
      - minio
    volumes:
      - ../engine:/app/engine
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: infra/engine.Dockerfile
    command: celery -A engine.worker.celery_app worker --loglevel=info --concurrency=4
    env_file: ../.env
    depends_on:
      - postgres
      - redis
    volumes:
      - ../engine:/app/engine
    restart: unless-stopped

  web:
    build:
      context: ../web
      dockerfile: ../infra/web.Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - engine
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${DB_NAME:-businessengine}
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  ollama_data:
